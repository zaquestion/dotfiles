# foot has no copy-mode. Its only keyboard-driven selection is search mode
# (ctrl+shift+r), which anchors on a match and can then only extend rightward
# and downward -- fine for grabbing one hit, useless for roaming the buffer. So
# rather than wait for foot to grow vim motions, the buffer is piped out to vim
# itself; ~/scripts/footpager does the handoff.
#
# ctrl+shift+[ mirrors tmux's copy-mode prefix (C-b [) and takes the whole
# history.
#
# It deliberately sits in the ctrl+shift+ namespace rather than on a bare
# ctrl+key: foot consumes a bound key instead of forwarding it, so binding
# ctrl+v here would take ^V away from nvim running inside this terminal (no
# blockwise visual) and from Claude Code (no clipboard image paste). Whatever
# the terminal hosts keeps its own keys.
#
# Shift plus punctuation works despite the usual xkb trouble (shift+[ is the
# keysym braceleft, not bracketleft): foot matches the "translated" keysym
# first, then falls back to the "untranslated" form, which is what's written
# below. See the key-bindings preamble in `man 5 foot.ini`.

[scrollback]
# 1000 is the default, which is short for a buffer meant to be paged back
# through and copied out of.
lines=10000

[key-bindings]
pipe-scrollback=[/home/zaq/scripts/footpager] Control+Shift+bracketleft

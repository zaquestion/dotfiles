# voxtype -- dictation, toggled with mod-slash. Press once to start talking,
# press again to transcribe, or just stop talking and let the silence watchdog
# end it. See ~/projects/voxtype for the source; setup.sh builds it.
#
# The keybinding is not here: dwl runs ~/scripts/dictate (bound in
# ~/projects/dwl/config.h), which drives voxtype over the CLI. The 10s
# silence auto-stop lives in that script too -- see the comment there for why
# it can't be done with anything in this file.

# Parakeet rather than whisper, for two reasons specific to dictation:
# whisper pads every clip to its 30s training window, so a five-second
# utterance costs what thirty seconds costs, and it was trained on YouTube
# subtitles so near-silent audio decodes to "Thank you for watching!" -- which
# matters doubly with a toggle binding, where a recording left running types
# that into whatever happens to be focused. Parakeet's encoder runs on the
# actual audio length and its transducer emits nothing at all on silence.
#
# Requires the binary to be built with `--features parakeet` (setup.sh does).
engine = "parakeet"

# $XDG_RUNTIME_DIR/voxtype/state, holding idle/recording/transcribing. The
# waybar module tails this; `record` and `status` need it either way.
state_file = "auto"

[hotkey]
# The built-in evdev grabber wants membership in the `input` group and a
# dedicated key it can own globally. dwl hands us the key instead, so it stays
# off and mod-slash remains an ordinary compositor binding.
enabled = false

# Only read by the evdev grabber above, which is off -- ~/scripts/dictate is
# what actually implements the toggle. Set anyway because streaming refuses to
# run in push-to-talk and auto-promotes this to "toggle", warning on every
# start otherwise. The reason is worth knowing: streaming types at the cursor
# *while* a push-to-talk key would still be held, and that injected typing
# makes libinput-based compositors lose track of the held key, so the release
# never arrives and the recording never ends.
mode = "toggle"

[audio]
# "pipewire" -- an ALSA device name, NOT a pipewire node name. voxtype's docs
# point you at `pactl list sources short`, but it enumerates through cpal/ALSA,
# so a node name like "effect_output.j316-mic" is simply not found and the
# daemon fails at record time with "Audio device not found". The list it will
# accept here is: pipewire, default, hw:CARD=AppleJ316HPAI,DEV=0,
# hw:CARD=AppleJ316,DEV=0.
#
# Of those, "pipewire" is the one that matters, because what it resolves to is
# the pipewire *default source* -- currently effect_output.j316-mic, the
# filter-chain node that the `pipewire -c filter-chain.conf` process publishes.
# That filter chain is doing the DSP the Asahi audio hardware expects the OS to
# do for it. Naming either hw:CARD= device instead would bypass it and hand
# over the raw mic array, which sounds bad enough to cost real accuracy.
#
# So if the headset jack is ever wanted, don't change this -- change the
# pipewire default source (`wpctl set-default`), and this follows it.
device = "pipewire"
sample_rate = 16000
# Backstop, not the normal path: ~/scripts/dictate ends a recording after 10s
# of silence, and a second mod-slash ends it immediately. This only fires if
# the watchdog was killed, or if you genuinely talk for two minutes straight.
max_duration_secs = 120

[parakeet]
# The "unified" build, and it is not a free choice -- it is bound to
# `streaming` below, in both directions. Get the pair wrong and dictation breaks
# silently, which is exactly what happened here for the life of this file.
#
#   streaming = true   -> MUST be parakeet-unified-en-0.6b
#       Only this one ships the `tokenizer.model` that parakeet-rs's cache-aware
#       pipeline wants at load time. voxtype flags tdt-0.6b-v3 as
#       streaming_compatible=false and refuses it outright -- a loud failure.
#
#   streaming = false  -> MUST be parakeet-tdt-0.6b-v3
#       The quiet one, and the bug this file shipped with. Down the ordinary
#       path voxtype cannot identify the unified model:
#
#         WARN Could not auto-detect model type from ".../parakeet-unified-en-0.6b",
#              defaulting to TDT
#
#       That default is wrong for this model and costs nothing visible: the load
#       succeeds, inference runs, and every decode comes out empty. Recording
#       worked, the bar turned red, and nothing was ever typed. Measured on one
#       identical 9s wav, changing only this line:
#
#         parakeet-unified-en-0.6b  ->  ""
#         parakeet-tdt-0.6b-v3      ->  "The quick brown fox jumps over the lazy
#                                        dog. Testing voice dictation, 12345."
#
# Note that streaming mode logs `Loading Parakeet streaming (ParakeetUnified)` --
# it identifies this model correctly there. Only the non-streaming loader is
# blind to it, which is why the broken combination gave no error to go on.
#
# So: never change this line alone. It moves with `streaming` in the same edit.
# The cost of being on this side of the pair is language coverage -- this build
# is English-only where tdt-0.6b-v3 does 25.
model = "parakeet-unified-en-0.6b"

# On: words appear as you talk. The price is visible self-correction mid
# sentence when the model revises an earlier word (a Replace event, which
# backspaces and retypes), and everything under [text] going inert -- see below.
#
# Read the `model` note above before touching this. The two are one setting
# wearing two names, and setting this to false without also changing the model
# back to tdt-0.6b-v3 produces empty transcriptions with no error.
#
# What being on costs is the text-processing chain, and voxtype drops it
# silently. Everything under [text] (spoken_punctuation, replacements,
# filler-word filtering) and all of [output.post_process] runs in exactly one
# place: handle_transcription_result in src/daemon.rs, the *non-streaming*
# completion path. The streaming event pump a couple of thousand lines further
# down types Partial/Final/Replace text straight through to the output chain and
# never touches the text processor. src/output/streaming.rs says so outright for
# post_process -- "intentionally bypassed during streaming", because processing
# each chunk independently would produce inconsistent output -- and spoken
# punctuation is bypassed for the same structural reason, just without the
# comment. So saying "period" types the word period.
#
# That is narrower than it sounds, and the distinction is worth keeping straight:
# what is lost is *spoken* punctuation, not punctuation. The model does its own
# capitalisation and punctuation inside the decode, which is upstream of any of
# this, so it survives. Measured, streaming, on the same wav:
#
#   "The quick brown fox jumps over the lazy dog. Testing voice dictation, 12345"
#
# Full stops and commas intact. What you give up is reaching for punctuation you
# have to *say*, plus [text.replacements] and filler filtering.
streaming = true

# These are live now that streaming is on, and they were previously wrong. The
# file carried 1.5/1.0/0.50 against prose describing 2.0/1.6/0.48, with a note to
# recheck before trusting either. The prose was right: all three of the old
# values fail the divisibility rule below (150/100/50 mel frames), so turning
# streaming on with them does not degrade, it refuses to start --
#
#   Error: Invalid Parakeet streaming config: left_context_secs must map to a
#   mel-frame count divisible by 8.
#
# They were corrected to the documented 2.0/1.6/0.48, and then tuned down from
# there for latency -- see the measurements below.
#
# Chunk is the feedback interval: text appears chunk + right after you say it, so
# these three set how far behind your voice the typing runs. 2.0/1.6/0.48 meant
# 2.48s, which is a long time to watch nothing happen. 0.8/1.28/0.24 is 1.04s.
#
# The old comment here reasoned that a smaller chunk might not keep up on CPU
# (this machine has no usable GPU for ONNX -- the EPs upstream ships are CUDA,
# TensorRT, MIGraphX and CoreML, none of which apply to an Apple GPU under
# Linux). That was worth checking rather than assuming, and it is not close.
# Measured on one 8.96s wav, whole-file streaming transcription, identical text
# out of every row:
#
#   chunk/left/right   latency   needs    inference
#   2.0/1.6/0.48        2.48s    2.04x      3.00s
#   1.28/1.6/0.32       1.60s    2.50x      2.92s
#   0.96/1.28/0.32      1.28s    2.66x      2.85s
#   0.8/1.28/0.24       1.04s    2.90x      2.85s   <- chosen
#   0.64/0.96/0.24      0.88s    2.87x      2.84s
#
# "needs" is the realtime factor the encoder must sustain, (left+chunk+right)/
# chunk. Actual encoder throughput works out at 7-9x realtime across all of them,
# so 0.8 keeps about 3x headroom -- and inference barely moves, because the total
# audio pushed through the encoder is roughly conserved: smaller chunks mean more
# passes over more overlap, each one cheaper.
#
# 0.64 was left on the table deliberately. It buys 0.16s and costs a third of the
# left context, and this was measured offline where nothing competes for CPU. If
# dictation ever stutters under load, walk this back up rather than down.
streaming_chunk_secs = 0.8

# These three cannot be set freely: parakeet-rs converts each to mel frames as
# secs * 16000 / 160, i.e. secs * 100, and rejects the config unless every one
# of them is divisible by the encoder's subsampling factor of 8. So each value
# has to be a multiple of 0.08s, and anything else fails at model load with
# "must map to a mel-frame count divisible by 8" -- the daemon exits, it does
# not fall back.
#
# voxtype's own defaults (1.5 and 0.5) are NOT valid here: they come to 150 and
# 50 frames. Check any new value the same way -- multiply by 100, divide by 8:
#   left  1.28s -> 128 frames (/8 = 16)
#   chunk 0.8s  ->  80 frames (/8 = 10)
#   right 0.24s ->  24 frames (/8 =  3)
#
# Right context is lookahead -- the pipeline waits for that much audio past a
# chunk before emitting it -- so it adds to the delay on top of the chunk. It is
# the cheapest latency to give back, which is why it went 0.48 -> 0.24 first.
#
# Left context is the amortisation knob, and the one to leave alone. It is what
# the encoder carries forward for continuity across chunk boundaries, so cutting
# it is the change most likely to cost accuracy rather than just time. 1.28s
# holds it near the original 1.6s while the chunk does the shrinking. For scale,
# parakeet-rs's own defaults (5.6/0.56/0.56) encode 6.72s per 0.56s chunk, which
# would need 12x realtime -- well past what this CPU sustains.
streaming_left_context_secs = 1.28
streaming_right_context_secs = 0.24

# Keep the model resident -- it is ~2.6GB against 30GB of RAM, and on-demand
# loading would put a cold load of that in front of every utterance.
on_demand_loading = false

[output]
# wtype types at the cursor via the virtual-keyboard protocol, which dwl
# supports natively -- no uinput, no root, unlike ydotool.
mode = "type"
# Off, and off *because* streaming is on -- this is the third setting tied to
# that switch, after `model` and the chunk values.
#
# The idea is that if a client mishandles the injected keymap the text lands on
# the clipboard rather than vanishing. That is a good fallback for one utterance
# and one write. Under streaming it is not: typing applies each chunk as an
# incremental delta at the cursor so the text accumulates, but the clipboard has
# no equivalent and every chunk simply *overwrites* the last. Measured directly,
# a 14s clip that typed fine came out of the clipboard path as only its final
# 25-character fragment -- and a fragment that looks like a whole sentence is
# worse than an error, because nothing about it says it is partial.
#
# Losing the text outright is the better failure here: it is obvious, and you
# just say it again. So this goes back to true if streaming ever goes back off.
fallback_to_clipboard = false
type_delay_ms = 0

[output.notification]
# The waybar module already shows the state; a notification on every utterance
# is noise on top of it.
on_recording_start = false
on_recording_stop = false

[osd]
# The on-screen display is a separate binary (voxtype-osd), built only with the
# osd-native/osd-gtk4 features -- which pull in wgpu/egui or gtk4. Not built
# here, and without this the daemon logs a "Failed to spawn `voxtype-osd`"
# warning every startup. The waybar module is the indicator instead.
enabled = false

[status]
# Drives the custom/voxtype waybar module. "nerd-font" resolves to the U+F1xx
# FontAwesome range (microphone, filled circle, spinner, mic-slash) -- the same
# range the rest of the bar draws from, and first in style.css's font stack.
# The emoji default would be the only emoji up there.
icon_theme = "nerd-font"

[status.icons]
# Override just the idle glyph. The theme's idle is U+F130, a *solid*
# microphone -- which is the identical glyph pulseaudio already draws for its
# source a couple of modules over, so the bar ended up with two mystery
# microphones and this one read as part of the volume readout. U+EC12 is the
# outline variant, unmistakably a different thing at a glance.
#
# It resolves through Symbols Nerd Font (FontAwesome and Weather Icons don't
# carry U+ECxx). Material Icons also claims it, but deliberately is not in
# style.css's stack -- see the warning there, it blanks all ASCII.
#
# Streaming needs an override for a different reason: the theme uses U+F519
# (broadcast tower) for it, which is a FontAwesome *5* codepoint. Debian's
# fonts-font-awesome is 4.x and has no such glyph, so it fell through the stack
# and rendered as an unrelated arrow. U+F111 is the filled circle the theme
# already uses for the non-streaming recording state: it exists in FontAwesome
# 4, and it is the universal record dot -- which is the right symbol anyway,
# since "streaming" and "recording" are the same thing to the person talking.
#
# That override is live: with streaming on, the state the daemon reports while
# the mic is open is "streaming", not "recording", so this is the glyph the bar
# actually draws. (It was inert while streaming was off, and would be again.)
#
# transcribing (spinner, U+F110) and stopped (mic-slash, U+F131) are left to
# the theme; both are FontAwesome 4 codepoints and both render.
idle = ""
streaming = ""

[text]
# "period" -> "." and friends. INERT AS CONFIGURED: this whole block only runs on
# the non-streaming completion path, and streaming is on up in [parakeet] -- see
# there. Saying "period" currently types the word. Left set to true so that
# turning streaming off restores it in the same edit rather than needing a second
# one; the model's own inferred punctuation is unaffected either way.
#
# The vocabulary is a fixed table in src/text/mod.rs, not configurable, longest
# phrase first: question mark, exclamation mark/point, open|close paren(thesis)
# /bracket/brace, at sign|symbol, dollar|percent|plus|equals sign, forward
# slash, single|double quote, new paragraph, new line, then the single words
# period, comma, colon, semicolon, dash, hyphen, underscore, hash, hashtag,
# percent, ampersand, asterisk, plus, equals, slash, backslash, pipe, tilde,
# backtick, tab. Matching is case-insensitive and on word boundaries, and
# spacing around the symbol is tidied up afterwards.
#
# There is no escape hatch: the words are always punctuation, so dictating a
# sentence *about* a semicolon is not something this mode can do. If that ever
# bites, [text.replacements] runs both before and after this pass and can map a
# phrase back.
spoken_punctuation = true
